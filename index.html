<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="K·Bloom">
<meta name="theme-color" content="#FF5FA0">
<title>K·Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FFFAFB;--bg2:#FFF5F8;--bg-card:#FFFFFF;--bg-inp:#FFE8F2;
  --acc:#FF5FA0;--acc-s:#FFD6EC;--acc2:#5BC8FF;--acc2s:#D8F0FF;
  --peach:#FFB870;--lav:#C0AAFF;--mint:#60D8A8;--star:#FFB800;
  --text:#2D1828;--t2:#8A6478;--t3:#C4A8B8;
  --bord:#FFD0E4;--sp:#1DB954;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A0D16;--bg2:#200F1C;--bg-card:#261524;--bg-inp:#361D30;
  --acc:#FF7DC0;--acc-s:#3A1028;--acc2:#60CAFF;--acc2s:#1A2A3A;
  --star:#FFB800;
  --text:#F8EEF4;--t2:#C8A0B8;--t3:#8A7088;--bord:#401830;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1A0D16;--bg2:#200F1C;--bg-card:#261524;--bg-inp:#361D30;
  --acc:#FF7DC0;--acc-s:#3A1028;--acc2:#60CAFF;--acc2s:#1A2A3A;
  --star:#FFB800;
  --text:#F8EEF4;--t2:#C8A0B8;--t3:#8A7088;--bord:#401830;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;}html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;}a{color:inherit;text-decoration:none;}input{font-family:inherit;}
.app-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--bg);border-bottom:2px solid var(--bord);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:54px;}
.logo-wrap{display:flex;align-items:center;gap:6px;}
.logo{font-family:'Dancing Script',cursive;font-size:26px;font-weight:700;color:var(--text);}
.logo span{color:var(--acc);}
.hdr-btn{background:none;border:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .15s;}
.hdr-btn:hover{background:var(--bord);}
.hdr-acts{display:flex;gap:2px;}
.tab-content{overflow-y:auto;overflow-x:hidden;padding-bottom:calc(62px + env(safe-area-inset-bottom,0px) + 8px);-webkit-overflow-scrolling:touch;}
.tab-panel{display:none;}.tab-panel.active{display:block;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--bg-card);border-top:2px solid var(--bord);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(58px + env(safe-area-inset-bottom,0px));}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:none;border:none;color:var(--t3);font-size:9px;font-weight:500;transition:color .15s;padding:4px 0;}
.nav-btn svg{display:block;}.nav-btn.active{color:var(--acc);}
.search-panel{position:fixed;top:54px;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--bg);z-index:55;overflow-y:auto;transform:translateY(-8px);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;}
.search-panel.open{transform:translateY(0);opacity:1;pointer-events:all;}
.search-bar-area{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--bord);display:flex;gap:10px;align-items:center;}
.si-wrap{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg-inp);border-radius:22px;padding:8px 14px;border:1.5px solid var(--bord);}
.si-wrap svg{flex-shrink:0;color:var(--t3);}
#search-input{flex:1;border:none;background:none;color:var(--text);font-size:14px;outline:none;}
#search-input::placeholder{color:var(--t3);}
.s-cancel{background:none;border:none;color:var(--acc);font-size:13px;font-weight:700;padding:0;}
#search-results{padding:8px 0 20px;}
.s-empty{padding:40px 20px;text-align:center;color:var(--t3);}
.s-empty-ico{font-size:44px;margin-bottom:10px;}
.toast{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--acc);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.hero{margin:14px 16px 0;background:linear-gradient(140deg,#FFABD0 0%,#FFC8E8 45%,#C8D8FF 100%);border-radius:22px;padding:22px 20px 20px;position:relative;overflow:hidden;}
.hero-sparkle{position:absolute;right:16px;top:12px;font-size:30px;opacity:.7;}
.hero-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.75);color:var(--acc);font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;padding:4px 10px;border-radius:20px;margin-bottom:10px;backdrop-filter:blur(4px);}
.hero-title{font-family:'Playfair Display',serif;font-style:italic;font-size:24px;font-weight:700;color:#2D1828;line-height:1.2;margin-bottom:6px;text-wrap:balance;}
.hero-desc{font-size:12px;color:rgba(45,24,40,.65);line-height:1.6;}
.hero-dots{display:flex;gap:6px;margin-top:14px;}
.hero-dot{width:8px;height:8px;border-radius:50%;}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 10px;}
.sec-tw{display:flex;align-items:center;gap:7px;}
.sec-ttl{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;font-weight:700;color:var(--text);}
.sec-more{background:none;border:none;color:var(--acc);font-size:12px;font-weight:700;padding:0;}
.h-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none;}
.h-scroll::-webkit-scrollbar{display:none;}
.tmini{flex-shrink:0;width:128px;background:var(--bg-card);border:1.5px solid var(--bord);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s;}
.tmini:active{transform:scale(.96);}
.tmini-thumb{height:80px;display:flex;align-items:center;justify-content:center;font-size:36px;}
.tmini-body{padding:8px 10px 10px;}
.tmini-name{font-size:11px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:2px;}
.tmini-ko{font-size:10px;color:var(--acc);font-weight:600;}
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.icard{background:var(--bg-card);border:1.5px solid var(--bord);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .15s;position:relative;user-select:none;}
.icard:active{transform:scale(.97);}
.icard-photo{aspect-ratio:3/4;position:relative;overflow:hidden;}
.icard-photo canvas{display:block;width:100%;height:100%;position:absolute;inset:0;}
.photo-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(28,12,24,.68) 0%,transparent 52%);pointer-events:none;}
.photo-cap{position:absolute;bottom:0;left:0;right:0;padding:10px 10px 11px;}
.photo-idol{font-family:'Playfair Display',serif;font-size:13px;font-weight:700;color:#fff;line-height:1.2;}
.photo-grp{font-size:10px;color:rgba(255,255,255,.72);}
.like-btn{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);border:none;display:flex;align-items:center;justify-content:center;font-size:13px;transition:transform .15s;}
.like-btn:active{transform:scale(.8);}
.like-btn.liked{background:var(--acc);color:#fff;}
.viewed-dot{position:absolute;top:8px;left:8px;z-index:2;width:8px;height:8px;background:var(--lav);border-radius:50%;border:2px solid var(--bg-card);}
.ig-btn{position:absolute;bottom:44px;right:8px;z-index:3;display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.92);color:#1a1a1a;font-size:9px;font-weight:700;padding:3px 7px;border-radius:10px;text-decoration:none;backdrop-filter:blur(4px);white-space:nowrap;}
.icard-body{padding:9px 11px 11px;}
.style-chip{display:inline-block;background:var(--acc-s);color:var(--acc);font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;margin-bottom:5px;}
.hair-diff{display:inline-block;background:var(--acc2s);color:var(--acc2);font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;margin-bottom:5px;}
.icard-brand{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px;}
.icard-price{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums;}
.icard-stars{display:flex;align-items:center;gap:1px;margin-top:3px;}
.stars-val{color:var(--star);font-size:11px;letter-spacing:.5px;}
.stars-num{font-size:11px;font-weight:700;color:var(--text);margin-left:2px;}
.stars-cnt{font-size:10px;color:var(--t3);margin-left:1px;}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:7px 16px;border-radius:20px;border:1.5px solid var(--bord);background:var(--bg-card);color:var(--t2);font-size:12px;font-weight:600;white-space:nowrap;transition:all .15s;}
.chip.active{background:var(--acc);border-color:var(--acc);color:#fff;}
.music-list{display:flex;flex-direction:column;gap:8px;padding:0 16px;}
.music-row{display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1.5px solid var(--bord);border-radius:16px;padding:11px 12px;cursor:pointer;transition:transform .15s;}
.music-row:active{transform:scale(.98);}
.music-rank-col{display:flex;flex-direction:column;align-items:center;width:28px;flex-shrink:0;}
.music-rank{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1;}
.rank-chg{font-size:9px;font-weight:700;margin-top:1px;}
.rank-up{color:#22C55E;}.rank-dn{color:#F87171;}.rank-same{color:var(--t3);}
.rank-new{color:var(--acc2);font-size:8px;}
.music-thumb{width:52px;height:52px;border-radius:12px;flex-shrink:0;position:relative;overflow:hidden;}
.music-thumb canvas{position:absolute;inset:0;width:100%;height:100%;}
.music-info{flex:1;min-width:0;}
.music-title{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.music-art{font-size:12px;color:var(--t3);margin-top:1px;}
.music-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center;}
.music-countries{font-size:13px;letter-spacing:1px;}
.music-member{font-size:10px;color:var(--acc);font-weight:600;}
.sp-link{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;background:var(--sp);color:#fff;border:none;border-radius:20px;padding:7px 10px;font-size:10px;font-weight:700;text-decoration:none;white-space:nowrap;}
.news-list{display:flex;flex-direction:column;gap:10px;padding:0 16px;}
.news-card{background:var(--bg-card);border:1.5px solid var(--bord);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .15s;}
.news-card:active{transform:scale(.98);}
.news-thumb{height:110px;position:relative;display:flex;align-items:flex-end;padding:12px;}
.news-thumb canvas{position:absolute;inset:0;width:100%;height:100%;}
.news-thumb-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,8,18,.7) 0%,transparent 60%);}
.news-cat{position:relative;z-index:1;display:inline-block;background:var(--acc);color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;}
.news-body{padding:12px 14px 14px;}
.news-headline{font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:5px;}
.news-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.news-grp{font-size:11px;color:var(--acc);font-weight:700;}
.news-date{font-size:11px;color:var(--t3);}
.news-desc{font-size:12px;color:var(--t2);line-height:1.6;}
.news-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.news-tag{font-size:10px;background:var(--bg-inp);color:var(--t3);padding:3px 8px;border-radius:8px;}
.save-panel{padding:16px;}
.save-empty{padding:50px 20px;text-align:center;color:var(--t3);}
.save-empty-ico{font-size:50px;margin-bottom:12px;}
.save-empty-ttl{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;}
.save-empty-txt{font-size:13px;line-height:1.7;}
.save-section-ttl{font-family:'Playfair Display',serif;font-style:italic;font-size:16px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.trend-list{display:flex;flex-direction:column;gap:14px;padding:0 16px;}
.trend-card{background:var(--bg-card);border:1.5px solid var(--bord);border-radius:20px;overflow:hidden;cursor:pointer;transition:transform .15s;}
.trend-card:active{transform:scale(.98);}
.trend-visual{height:150px;position:relative;overflow:hidden;}
.trend-visual canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.trend-visual-ov{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(28,12,24,.18) 0%,rgba(28,12,24,.55) 100%);}
.trend-rank-badge{position:absolute;top:12px;left:14px;font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:rgba(255,255,255,.92);line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.3);}
.trend-icon-big{position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);font-size:52px;filter:drop-shadow(0 3px 10px rgba(0,0,0,.2));}
.trend-ko-ov{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.88);letter-spacing:.5px;text-shadow:0 1px 4px rgba(0,0,0,.4);}
.trend-body{padding:14px 16px 16px;}
.trend-name{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.3;}
.trend-ko{font-size:11px;color:var(--acc);font-weight:600;margin-bottom:8px;}
.trend-desc{font-size:12px;color:var(--t2);line-height:1.6;margin-bottom:10px;}
.tag-row{display:flex;flex-wrap:wrap;gap:5px;}
.tag{font-size:10px;background:var(--bg-inp);color:var(--t3);padding:3px 8px;border-radius:8px;}
.modal{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .36s cubic-bezier(.32,.72,0,1);-webkit-overflow-scrolling:touch;}
.modal.open{transform:translateY(0);}
.modal-hdr{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1.5px solid var(--bord);}
.back-btn{background:none;border:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:22px;flex-shrink:0;transition:background .15s;}
.back-btn:hover{background:var(--bord);}
.modal-ttl{font-size:16px;font-weight:700;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.modal-photo{width:100%;aspect-ratio:3/4;max-height:400px;position:relative;overflow:hidden;}
.modal-photo canvas{display:block;width:100%;height:100%;position:absolute;inset:0;}
.modal-body{padding:20px 16px 100px;}
.modal-idol{font-family:'Playfair Display',serif;font-style:italic;font-size:28px;font-weight:700;color:var(--text);line-height:1.1;margin-bottom:3px;}
.modal-grp{font-size:14px;color:var(--acc);font-weight:700;margin-bottom:6px;}
.modal-chip{display:inline-block;background:var(--acc-s);color:var(--acc);font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:10px;}
.modal-chip2{display:inline-block;background:var(--acc2s);color:var(--acc2);font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:10px;}
.modal-rating{display:flex;align-items:center;gap:4px;margin-bottom:18px;}
.items-lbl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;margin-top:4px;}
.item-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
.item-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg-card);border:1.5px solid var(--bord);border-radius:14px;padding:12px 14px;gap:12px;}
.shop-row{cursor:pointer;text-decoration:none;color:inherit;transition:background .15s,transform .1s;display:flex;justify-content:space-between;align-items:center;background:var(--bg-card);border:1.5px solid var(--bord);border-radius:14px;padding:12px 14px;gap:12px;}
.shop-row:active{background:var(--bg-inp);transform:scale(.98);}
.item-cat{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.item-nm{font-size:13px;font-weight:600;color:var(--text);}
.item-stars{display:flex;align-items:center;gap:1px;margin-top:2px;}
.item-right{text-align:right;flex-shrink:0;}
.item-pr{font-size:14px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap;}
.shop-arr{font-size:10px;color:var(--acc);font-weight:700;margin-top:2px;}
.steps-section{margin-bottom:22px;}
.step-card{background:var(--bg2);border:1.5px solid var(--bord);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;}
.step-tip{font-size:12px;color:var(--t2);line-height:1.6;}
.step-point{font-size:10px;background:var(--acc-s);color:var(--acc);padding:2px 8px;border-radius:8px;font-weight:700;margin-top:4px;display:inline-block;}
.hair-tip-box{background:var(--acc-s);border-radius:14px;padding:14px;margin-bottom:20px;}
.hair-tip-txt{font-size:13px;color:var(--acc);font-weight:600;line-height:1.7;}
.modal-tools-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;}
.tool-chip{background:var(--bg2);border:1.5px solid var(--bord);border-radius:10px;padding:5px 12px;font-size:12px;color:var(--t2);font-weight:500;}
.similar-ttl{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;font-weight:700;color:var(--text);margin-bottom:14px;}
.rec-empty{padding:32px 20px;text-align:center;color:var(--t3);}
.rec-empty-ico{font-size:40px;margin-bottom:10px;}
.rec-empty-txt{font-size:13px;line-height:1.7;}
.song-meta-bar{display:flex;gap:0;background:var(--bg2);border-radius:14px;overflow:hidden;margin-bottom:20px;}
.song-meta-item{flex:1;padding:12px 10px;text-align:center;border-right:1px solid var(--bord);}
.song-meta-item:last-child{border-right:none;}
.song-meta-lbl{font-size:9px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:3px;}
.song-meta-val{font-size:13px;font-weight:700;color:var(--text);line-height:1.2;}
.sp-btn-big{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--sp);color:#fff;border-radius:50px;padding:14px 24px;font-size:14px;font-weight:700;text-decoration:none;margin-bottom:24px;}
.sp-btn-big:active{opacity:.85;}
.artist-rank-badge{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:14px;}
.artist-stats{display:flex;background:var(--bg2);border-radius:14px;overflow:hidden;margin-bottom:18px;}
.artist-stat{flex:1;padding:13px 8px;text-align:center;border-right:1px solid var(--bord);}
.artist-stat:last-child{border-right:none;}
.artist-stat-val{font-size:15px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.2;}
.artist-stat-lbl{font-size:10px;color:var(--t3);font-weight:600;margin-top:2px;}
.clickable-art{cursor:pointer;color:var(--acc);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:14px;}
.clickable-art:active{opacity:.7;}

let viewedTags={},savedItems=new Set(),viewedItems=new Set();
let fashionFilter='すべて',makeupFilter='すべて';
let searchOpen=false;
(function(){
  try{const s=JSON.parse(localStorage.getItem('kbloom_v3')||'{}');
    viewedTags=s.vt||{};savedItems=new Set(s.saved||[]);viewedItems=new Set(s.viewed||[]);}
  catch(e){}
})();
function save(){try{localStorage.setItem('kbloom_v3',JSON.stringify({vt:viewedTags,saved:[...savedItems],viewed:[...viewedItems]}));}catch(e){}}
function recordView(item){viewedItems.add(item.id);(item.tags||[]).forEach(t=>{viewedTags[t]=(viewedTags[t]||0)+1;});save();}
function sc(item){return(item.tags||[]).reduce((s,t)=>s+(viewedTags[t]||0),0);}
function topRecs(xid,pool,lim){return[...pool].filter(x=>x.id!==xid).sort((a,b)=>sc(b)-sc(a)).slice(0,lim||6);}
function toggleSave(id,e){
  e&&e.stopPropagation();
  if(savedItems.has(id))savedItems.delete(id);else savedItems.add(id);
  save();
  document.querySelectorAll(`.like-btn[data-id="${id}"]`).forEach(b=>{
    b.classList.toggle('liked',savedItems.has(id));
    b.innerHTML=savedItems.has(id)?'♥':'♡';
  });
  showToast(savedItems.has(id)?'コレクションに保存しました ♡':'コレクションから削除しました');
}

// ── TOAST ─────────────────────────────────────────────────────────────────
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

// ── LONG PRESS ───────────────────────────────────────────────────────────
let pressTimer=null;
function startPress(id,e){
  endPress();
  pressTimer=setTimeout(()=>{
    pressTimer=null;
    if(!savedItems.has(id)){savedItems.add(id);save();}
    document.querySelectorAll(`.like-btn[data-id="${id}"]`).forEach(b=>{b.classList.add('liked');b.innerHTML='♥';});
    showToast('コレクションに保存しました ♡');

}
function endPress(){clearTimeout(pressTimer);pressTimer=null;}

// ── CANVAS ──────────────────────────────────────────────────────────────
function drawCV(cv,cols,ini,w,h){
  cv.width=w||300;cv.height=h||400;
  const ctx=cv.getContext('2d'),cw=cv.width,ch=cv.height;
  const g=ctx.createLinearGradient(0,0,cw*.75,ch);
  g.addColorStop(0,cols[0]);g.addColorStop(1,cols[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);
  [[.78,.12,.3,.18],[.1,.82,.24,.12],[.42,.45,.16,.07]].forEach(([x,y,r,a])=>{
    ctx.globalAlpha=a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cw*x,ch*y,cw*r,0,6.28);ctx.fill();
  });
  ctx.fillStyle='rgba(255,255,255,.9)';
  [[.18,.2,.048],[.72,.15,.038],[.82,.5,.03],[.28,.7,.042],[.58,.8,.028]].forEach(([x,y,s])=>{
    ctx.globalAlpha=.5;star5(ctx,cw*x,ch*y,cw*s,cw*s*.42);
  });
  [[.62,.3,.055],[.25,.48,.038]].forEach(([x,y,s])=>{
    ctx.globalAlpha=.38;ctx.fillStyle='rgba(255,255,255,.85)';heartCV(ctx,cw*x,ch*y,cw*s);
  });
  bowCV(ctx,cw*.78,ch*.08,cw*.1);
  ctx.globalAlpha=1;
  ctx.font=`700 italic ${Math.round(ch*.6)}px Georgia,serif`;
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.textAlign='right';ctx.textBaseline='bottom';
  ctx.fillText(ini,cw-8,ch-4);
}
function star5(ctx,cx,cy,r1,r2){ctx.beginPath();for(let i=0;i<10;i++){const r=i%2?r2:r1,a=(i*Math.PI/5)-Math.PI/2;i?ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.closePath();ctx.fill();}
function heartCV(ctx,cx,cy,s){ctx.save();ctx.translate(cx,cy);ctx.beginPath();ctx.moveTo(0,s*.3);ctx.bezierCurveTo(-s*.5,-s*.3,-s*1.1,s*.1,-s*1.1,s*.7);ctx.bezierCurveTo(-s*1.1,s*1.3,0,s*1.7,0,s*2);ctx.bezierCurveTo(0,s*1.7,s*1.1,s*1.3,s*1.1,s*.7);ctx.bezierCurveTo(s*1.1,s*.1,s*.5,-s*.3,0,s*.3);ctx.fill();ctx.restore();}
function bowCV(ctx,cx,cy,s){ctx.globalAlpha=.35;ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.moveTo(cx,cy);ctx.bezierCurveTo(cx-s*.4,cy-s*.5,cx-s,cy-s*.4,cx-s*.9,cy);ctx.bezierCurveTo(cx-s,cy+s*.4,cx-s*.4,cy+s*.5,cx,cy);ctx.fill();ctx.beginPath();ctx.moveTo(cx,cy);ctx.bezierCurveTo(cx+s*.4,cy-s*.5,cx+s,cy-s*.4,cx+s*.9,cy);ctx.bezierCurveTo(cx+s,cy+s*.4,cx+s*.4,cy+s*.5,cx,cy);ctx.fill();ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.ellipse(cx,cy,s*.2,s*.15,0,0,6.28);ctx.fill();}
function initCV(){
  requestAnimationFrame(()=>{
    document.querySelectorAll('canvas[data-col]').forEach(cv=>{
      try{const cols=JSON.parse(cv.dataset.col),ini=cv.dataset.ini||'K',big=cv.dataset.big,land=cv.dataset.land;
        drawCV(cv,cols,ini,big?600:land?600:300,big?800:land?240:400);}
      catch(e){}
    });
  });
}

function toggleSearch(){searchOpen=!searchOpen;document.getElementById('search-panel').classList.toggle('open',searchOpen);if(searchOpen)setTimeout(()=>document.getElementById('search-input').focus(),200);}

function doSearch(q){
  q=q.trim().toLowerCase();
  if(!q){document.getElementById('search-results').innerHTML=`<div class="s-empty"><div class="s-empty-ico">🔍</div><div>アイドル名・グループ名・ブランド名・曲名で検索</div></div>`;return;}
  const fR=FASHION.filter(x=>x.idol.toLowerCase().includes(q)||x.group.toLowerCase().includes(q)||x.styleTag.toLowerCase().includes(q)||x.tags.some(t=>t.toLowerCase().includes(q))||x.items.some(i=>i.name.toLowerCase().includes(q)));
  const mR=MAKEUP.filter(x=>x.idol.toLowerCase().includes(q)||x.group.toLowerCase().includes(q)||x.lookName.toLowerCase().includes(q)||x.tags.some(t=>t.toLowerCase().includes(q))||x.items.some(i=>i.name.toLowerCase().includes(q)));
  const hR=HAIR.filter(x=>x.style.toLowerCase().includes(q)||x.idol.toLowerCase().includes(q)||x.group.toLowerCase().includes(q)||x.tags.some(t=>t.toLowerCase().includes(q)));
  const muR=MUSIC.filter(x=>x.title.toLowerCase().includes(q)||x.artist.toLowerCase().includes(q));
  const nR=NEWS.filter(x=>x.headline.toLowerCase().includes(q)||x.group.toLowerCase().includes(q)||x.tags.some(t=>t.toLowerCase().includes(q)));
  if(!fR.length&&!mR.length&&!hR.length&&!muR.length&&!nR.length){document.getElementById('search-results').innerHTML=`<div class="s-empty"><div class="s-empty-ico">🌸</div><div>「${q}」の検索結果はありませんでした</div></div>`;return;}
  let html='';
  if(fR.length)html+=`<div class="sec-hdr"><div class="sec-tw">${bow(14)}<span class="sec-ttl" style="font-size:15px">ファッション</span></div></div><div class="cards-grid">${fR.map(x=>fashCard(x,false)).join('')}</div>`;
  if(mR.length)html+=`<div class="sec-hdr"><div class="sec-tw">${bow(14)}<span class="sec-ttl" style="font-size:15px">メイク</span></div></div><div class="cards-grid">${mR.map(x=>mkCard(x,false)).join('')}</div>`;
  if(hR.length)html+=`<div class="sec-hdr"><div class="sec-tw">${bow(14)}<span class="sec-ttl" style="font-size:15px">ヘアスタイル</span></div></div><div class="cards-grid">${hR.map(hairCard).join('')}</div>`;
  if(muR.length)html+=`<div class="sec-hdr"><div class="sec-tw">${bow(14)}<span class="sec-ttl" style="font-size:15px">音楽</span></div></div><div class="music-list" style="padding:0 16px;">${muR.map(muRow).join('')}</div>`;
  if(nR.length)html+=`<div class="sec-hdr"><div class="sec-tw">${bow(14)}<span class="sec-ttl" style="font-size:15px">ニュース</span></div></div><div style="display:flex;flex-direction:column;gap:10px;padding:0 16px;">${nR.map(newsCard).join('')}</div>`;
  document.getElementById('search-results').innerHTML=html;initCV();
}

const TABS={home:renderHome,fashion:renderFashion,makeup:renderMakeup,music:renderMusic,news:renderNews,saved:renderSaved,trends:renderTrends};
function switchTab(tab){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  TABS[tab]();

}

// ── LIVE NEWS ────────────────────────────────────────────────────────────────
(async function fetchLiveNews(){
  const KPOP_GROUPS=['BLACKPINK','aespa','NewJeans','IVE','LE SSERAFIM','TWICE','ILLIT','BABYMONSTER','(G)I-DLE','ITZY','STRAY KIDS','BTS','EXO','NCT','SEVENTEEN','ATEEZ','TXT','ENHYPEN','BIGBANG','MAMAMOO','WINNER','ZICO','JENNIE','LISA','JISOO','ROSÉ','KARINA','NINGNING','WINTER','GISELLE'];
  const PALETTES=[['#FFD880','#FF9860'],['#FFD4A0','#FFB0CC'],['#D8C8FF','#C0E4FF'],['#A8D8FF','#B8F8E0'],['#FFA8A8','#A8A8FF'],['#FFB8D0','#FFD8A0'],['#C8C0FF','#A8E8C0'],['#A8D8FF','#C8F8E8']];
  function stripHtml(s){return(s||'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ').replace(/&#39;/g,"'").replace(/&quot;/g,'"').trim();}
  function findGroup(t){for(const g of KPOP_GROUPS)if(t.includes(g))return g;return'';}
  function catFromTitle(t){const tl=t.toLowerCase();if(tl.includes('concert')||tl.includes('tour'))return 'コンサート';if(tl.includes('album')||tl.includes('release')||tl.includes('comeback'))return 'リリース';if(tl.includes('chart')||tl.includes('record')||tl.includes('million'))return '記録';if(tl.includes('fashion')||tl.includes('brand')||tl.includes('ambassador'))return 'ファッション';return 'ニュース';}
  try{
    const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fsoompi.com%2Fcategory%2Fnews%2Ffeed%2F&count=8');
    const d=await r.json();
    if(d.status==='ok'&&d.items?.length>=2){
      const live=d.items.map((item,i)=>{
        const grp=findGroup(item.title);
        const desc=stripHtml(item.description||item.content||'');
        return{id:'ln'+i,emoji:'📰',cat:catFromTitle(item.title),group:grp,headline:item.title,date:(item.pubDate||'').slice(0,10).replace(/-/g,'.'),desc:desc.slice(0,160)+(desc.length>160?'…':''),tags:grp?[grp,'Soompi']:['K-POP','Soompi'],colors:PALETTES[i%PALETTES.length]};
      });
      NEWS.splice(0,NEWS.length,...live);
      _liveNews=true;
      if(document.getElementById('panel-news').classList.contains('active'))renderNews();
    }
  }catch(e){}
})();
